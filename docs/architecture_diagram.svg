<svg width="680" viewBox="0 0 680 660" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Telecom Billing DWH — Pipeline Architecture</title>
  <desc>Medallion pipeline from Huawei CBS and MSC through SFTP, Landing Zone, Bronze, DQ Gate, Silver, Gold to Mart</desc>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .th  { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .ts  { font-size: 12px; font-weight: 400; fill: #555555; }

    .box-gray   { fill: #f5f5f0; stroke: #c0bfb8; }
    .box-blue   { fill: #e6f1fb; stroke: #378add; }
    .box-amber  { fill: #faeeda; stroke: #ba7517; }
    .box-coral  { fill: #faece7; stroke: #d85a30; }
    .box-teal   { fill: #e1f5ee; stroke: #1d9e75; }
    .box-purple { fill: #eeedfe; stroke: #7f77dd; }
    .box-red    { fill: #fcebeb; stroke: #e24b4a; }
    .text-amber { fill: #633806; }
    .text-coral { fill: #712b13; }
    .text-teal  { fill: #085041; }
    .text-purple{ fill: #3c3489; }
    .text-blue  { fill: #0c447c; }
    .text-red   { fill: #791f1f; }
    .text-gray  { fill: #444441; }
    .sub-amber  { fill: #854f0b; }
    .sub-coral  { fill: #993c1d; }
    .sub-teal   { fill: #0f6e56; }
    .sub-purple { fill: #534ab7; }
    .sub-gray   { fill: #5f5e5a; }
    .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
    .dash{ stroke: #c0bfb8; stroke-width: 0.8; fill: none; stroke-dasharray: 4 3; }
  </style>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- SOURCE SYSTEMS -->
  <rect x="90" y="20" width="190" height="52" rx="8" stroke-width="0.5" class="box-gray"/>
  <text class="th text-gray" x="185" y="43" text-anchor="middle" dominant-baseline="central">Huawei CBS</text>
  <text class="ts sub-gray" x="185" y="61" text-anchor="middle" dominant-baseline="central">billing events</text>

  <rect x="330" y="20" width="190" height="52" rx="8" stroke-width="0.5" class="box-gray"/>
  <text class="th text-gray" x="425" y="43" text-anchor="middle" dominant-baseline="central">Huawei MSC</text>
  <text class="ts sub-gray" x="425" y="61" text-anchor="middle" dominant-baseline="central">CDRs</text>

  <line x1="185" y1="72" x2="278" y2="104" class="arr" marker-end="url(#arr)"/>
  <line x1="425" y1="72" x2="332" y2="104" class="arr" marker-end="url(#arr)"/>

  <!-- SFTP -->
  <rect x="90" y="104" width="430" height="40" rx="6" stroke-width="0.5" class="box-blue"/>
  <text class="th text-blue" x="305" y="124" text-anchor="middle" dominant-baseline="central">SFTP · every 30 min</text>
  <line x1="305" y1="144" x2="305" y2="168" class="arr" marker-end="url(#arr)"/>

  <!-- LANDING -->
  <rect x="150" y="168" width="310" height="48" rx="8" stroke-width="0.5" class="box-gray"/>
  <text class="th text-gray" x="305" y="186" text-anchor="middle" dominant-baseline="central">Landing zone</text>
  <text class="ts sub-gray" x="305" y="204" text-anchor="middle" dominant-baseline="central">data/landing/ · raw CSV drop</text>
  <line x1="305" y1="216" x2="305" y2="240" class="arr" marker-end="url(#arr)"/>

  <!-- BRONZE -->
  <rect x="90" y="240" width="430" height="52" rx="8" stroke-width="0.5" class="box-amber"/>
  <text class="th text-amber" x="305" y="260" text-anchor="middle" dominant-baseline="central">Bronze</text>
  <text class="ts sub-amber" x="305" y="278" text-anchor="middle" dominant-baseline="central">append-only Parquet · full lineage audit</text>
  <line x1="305" y1="292" x2="305" y2="316" class="arr" marker-end="url(#arr)"/>

  <!-- DQ GATE -->
  <rect x="90" y="316" width="430" height="52" rx="8" stroke-width="0.5" class="box-coral"/>
  <text class="th text-coral" x="305" y="336" text-anchor="middle" dominant-baseline="central">DQ gate</text>
  <text class="ts sub-coral" x="305" y="354" text-anchor="middle" dominant-baseline="central">5 rule categories · quarantine bad rows</text>
  <line x1="520" y1="342" x2="568" y2="342" class="arr" marker-end="url(#arr)"/>
  <rect x="568" y="322" width="92" height="40" rx="6" stroke-width="0.5" class="box-red"/>
  <text class="th text-red" x="614" y="338" text-anchor="middle" dominant-baseline="central">Quarantine</text>
  <text class="ts text-red" x="614" y="354" text-anchor="middle" dominant-baseline="central">bad rows</text>
  <line x1="305" y1="368" x2="305" y2="392" class="arr" marker-end="url(#arr)"/>

  <!-- SILVER -->
  <rect x="90" y="392" width="430" height="52" rx="8" stroke-width="0.5" class="box-teal"/>
  <text class="th text-teal" x="305" y="412" text-anchor="middle" dominant-baseline="central">Silver</text>
  <text class="ts sub-teal" x="305" y="430" text-anchor="middle" dominant-baseline="central">PySpark · typed · deduped · enriched</text>
  <line x1="305" y1="444" x2="305" y2="468" class="arr" marker-end="url(#arr)"/>

  <!-- GOLD -->
  <rect x="90" y="468" width="430" height="52" rx="8" stroke-width="0.5" class="box-amber"/>
  <text class="th text-amber" x="305" y="488" text-anchor="middle" dominant-baseline="central">Gold</text>
  <text class="ts sub-amber" x="305" y="506" text-anchor="middle" dominant-baseline="central">star schema · CDR reconciliation · is_reconciled</text>
  <line x1="305" y1="520" x2="305" y2="544" class="arr" marker-end="url(#arr)"/>

  <!-- MART -->
  <rect x="90" y="544" width="430" height="52" rx="8" stroke-width="0.5" class="box-purple"/>
  <text class="th text-purple" x="305" y="564" text-anchor="middle" dominant-baseline="central">Mart</text>
  <text class="ts sub-purple" x="305" y="582" text-anchor="middle" dominant-baseline="central">DuckDB KPIs · ARPU · MOU · Revenue · Recon</text>

  <!-- AIRFLOW RAIL -->
  <line x1="56" y1="240" x2="56" y2="596" class="dash"/>
  <line x1="56" y1="266" x2="90" y2="266" class="dash"/>
  <line x1="56" y1="342" x2="90" y2="342" class="dash"/>
  <line x1="56" y1="418" x2="90" y2="418" class="dash"/>
  <line x1="56" y1="494" x2="90" y2="494" class="dash"/>
  <line x1="56" y1="570" x2="90" y2="570" class="dash"/>
  <rect x="20" y="390" width="28" height="116" rx="4" stroke-width="0.5" class="box-blue"/>
  <text class="ts text-blue" x="34" y="448" text-anchor="middle" dominant-baseline="central" transform="rotate(-90,34,448)">Airflow DAG · 30 min</text>

  <!-- LEGEND -->
  <line x1="90" y1="618" x2="590" y2="618" stroke="#c0bfb8" stroke-width="0.5"/>
  <text class="ts sub-gray" x="90" y="636" dominant-baseline="central">Amber = storage · Teal = transform · Purple = mart · Coral = quality · Red = quarantine</text>
</svg>
