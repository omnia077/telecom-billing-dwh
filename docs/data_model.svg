<svg width="680" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Billing data warehouse — star schema</title>
  <desc>Star schema with fact_billing at center surrounded by five dimension tables. Arrows go from fact to dims. is_reconciled highlighted as revenue assurance signal.</desc>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .th  { font-size: 14px; font-weight: 600; }
    .ts  { font-size: 12px; font-weight: 400; }
    .box-gray   { fill: #f5f5f0; stroke: #c0bfb8; }
    .box-teal   { fill: #e1f5ee; stroke: #1d9e75; }
    .box-purple { fill: #eeedfe; stroke: #7f77dd; }
    .text-teal  { fill: #085041; }
    .text-purple{ fill: #3c3489; }
    .text-gray  { fill: #444441; }
    .sub-teal   { fill: #0f6e56; }
    .sub-purple { fill: #534ab7; }
    .sub-gray   { fill: #5f5e5a; }
    .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
    .div { stroke: #c0bfb8; stroke-width: 0.5; }
  </style>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- TITLE -->
  <text class="th text-gray" x="340" y="26" text-anchor="middle" dominant-baseline="central" font-size="16">Billing data warehouse — star schema</text>

  <!-- RECONCILIATION LEGEND TOP RIGHT -->
  <rect x="488" y="44" width="172" height="82" rx="8" stroke-width="0.5" class="box-gray"/>
  <text class="th text-gray" x="574" y="64" text-anchor="middle" dominant-baseline="central">Reconciliation signal</text>
  <line x1="488" y1="76" x2="660" y2="76" class="div"/>
  <text class="ts sub-gray" x="504" y="94" dominant-baseline="central">1 → reconciled (CDR matched)</text>
  <text class="ts sub-gray" x="504" y="114" dominant-baseline="central">0 → leakage risk (no CDR)</text>

  <!-- FACT TABLE (center) -->
  <rect x="208" y="148" width="264" height="240" rx="10" stroke-width="0.5" class="box-teal"/>
  <text class="th text-teal" x="340" y="170" text-anchor="middle" dominant-baseline="central">fact_billing</text>
  <line x1="208" y1="184" x2="472" y2="184" class="div"/>
  <text class="ts sub-teal" x="224" y="202" dominant-baseline="central">fact_id</text>
  <text class="ts sub-teal" x="466" y="202" text-anchor="end" dominant-baseline="central">surrogate key</text>
  <text class="ts sub-teal" x="224" y="220" dominant-baseline="central">customer_id</text>
  <text class="ts sub-teal" x="466" y="220" text-anchor="end" dominant-baseline="central">FK → dim_customer</text>
  <text class="ts sub-teal" x="224" y="238" dominant-baseline="central">service_id</text>
  <text class="ts sub-teal" x="466" y="238" text-anchor="end" dominant-baseline="central">FK → dim_service</text>
  <text class="ts sub-teal" x="224" y="256" dominant-baseline="central">date_id</text>
  <text class="ts sub-teal" x="466" y="256" text-anchor="end" dominant-baseline="central">FK → dim_date</text>
  <text class="ts sub-teal" x="224" y="274" dominant-baseline="central">region_id</text>
  <text class="ts sub-teal" x="466" y="274" text-anchor="end" dominant-baseline="central">FK → dim_region</text>
  <text class="ts sub-teal" x="224" y="292" dominant-baseline="central">plan_id</text>
  <text class="ts sub-teal" x="466" y="292" text-anchor="end" dominant-baseline="central">FK → dim_plan</text>
  <text class="ts sub-teal" x="224" y="310" dominant-baseline="central">billed_amount</text>
  <text class="ts sub-teal" x="466" y="310" text-anchor="end" dominant-baseline="central">SDG</text>
  <text class="ts sub-teal" x="224" y="328" dominant-baseline="central">billing_month · status · currency</text>
  <!-- is_reconciled highlighted row -->
  <rect x="210" y="338" width="260" height="24" rx="3" fill="#faeeda" stroke="none"/>
  <text class="ts" x="224" y="350" dominant-baseline="central" fill="#633806">is_reconciled</text>
  <text class="ts" x="466" y="350" text-anchor="end" dominant-baseline="central" fill="#633806">revenue assurance signal</text>

  <!-- DIM_CUSTOMER (left) — arrows FROM fact TO dim -->
  <rect x="18" y="158" width="164" height="132" rx="8" stroke-width="0.5" class="box-purple"/>
  <text class="th text-purple" x="100" y="178" text-anchor="middle" dominant-baseline="central">dim_customer</text>
  <line x1="18" y1="192" x2="182" y2="192" class="div"/>
  <text class="ts sub-purple" x="32" y="210" dominant-baseline="central">customer_id</text>
  <text class="ts sub-purple" x="32" y="228" dominant-baseline="central">msisdn</text>
  <text class="ts sub-purple" x="32" y="246" dominant-baseline="central">segment · plan</text>
  <text class="ts sub-purple" x="32" y="264" dominant-baseline="central">region · is_active</text>
  <line x1="208" y1="230" x2="184" y2="230" class="arr" marker-end="url(#arr)"/>

  <!-- DIM_SERVICE (right) — arrow FROM fact TO dim -->
  <rect x="498" y="158" width="164" height="114" rx="8" stroke-width="0.5" class="box-purple"/>
  <text class="th text-purple" x="580" y="178" text-anchor="middle" dominant-baseline="central">dim_service</text>
  <line x1="498" y1="192" x2="662" y2="192" class="div"/>
  <text class="ts sub-purple" x="512" y="210" dominant-baseline="central">service_id</text>
  <text class="ts sub-purple" x="512" y="228" dominant-baseline="central">service_type</text>
  <text class="ts sub-purple" x="512" y="246" dominant-baseline="central">service_category</text>
  <line x1="472" y1="248" x2="496" y2="230" class="arr" marker-end="url(#arr)"/>

  <!-- DIM_DATE (bottom left) — arrow FROM fact TO dim -->
  <rect x="18" y="420" width="164" height="114" rx="8" stroke-width="0.5" class="box-purple"/>
  <text class="th text-purple" x="100" y="440" text-anchor="middle" dominant-baseline="central">dim_date</text>
  <line x1="18" y1="454" x2="182" y2="454" class="div"/>
  <text class="ts sub-purple" x="32" y="472" dominant-baseline="central">date_id</text>
  <text class="ts sub-purple" x="32" y="490" dominant-baseline="central">full_date</text>
  <text class="ts sub-purple" x="32" y="508" dominant-baseline="central">month · quarter · year</text>
  <line x1="232" y1="388" x2="170" y2="422" class="arr" marker-end="url(#arr)"/>

  <!-- DIM_REGION (bottom right) — arrow FROM fact TO dim -->
  <rect x="498" y="420" width="164" height="114" rx="8" stroke-width="0.5" class="box-purple"/>
  <text class="th text-purple" x="580" y="440" text-anchor="middle" dominant-baseline="central">dim_region</text>
  <line x1="498" y1="454" x2="662" y2="454" class="div"/>
  <text class="ts sub-purple" x="512" y="472" dominant-baseline="central">region_id</text>
  <text class="ts sub-purple" x="512" y="490" dominant-baseline="central">region_name</text>
  <text class="ts sub-purple" x="512" y="508" dominant-baseline="central">governorate · zone</text>
  <line x1="448" y1="388" x2="510" y2="422" class="arr" marker-end="url(#arr)"/>

  <!-- DIM_PLAN (bottom center) — arrow FROM fact TO dim -->
  <rect x="220" y="460" width="200" height="114" rx="8" stroke-width="0.5" class="box-purple"/>
  <text class="th text-purple" x="320" y="480" text-anchor="middle" dominant-baseline="central">dim_plan</text>
  <line x1="220" y1="494" x2="420" y2="494" class="div"/>
  <text class="ts sub-purple" x="234" y="512" dominant-baseline="central">plan_id</text>
  <text class="ts sub-purple" x="234" y="530" dominant-baseline="central">plan_name · plan_tier</text>
  <text class="ts sub-purple" x="234" y="548" dominant-baseline="central">expected_arpu (SDG)</text>
  <line x1="320" y1="388" x2="320" y2="458" class="arr" marker-end="url(#arr)"/>

  <!-- FULL LEGEND -->
  <line x1="18" y1="588" x2="662" y2="588" stroke="#c0bfb8" stroke-width="0.5"/>
  <text class="ts sub-gray" x="18" y="606" dominant-baseline="central">Teal = fact table</text>
  <text class="ts sub-gray" x="160" y="606" dominant-baseline="central">Purple = dimension tables</text>
  <text class="ts sub-gray" x="360" y="606" dominant-baseline="central">Amber highlight = revenue assurance signal</text>
</svg>
